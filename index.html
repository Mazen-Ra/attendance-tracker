/* Utility: normalize Arabic text for matching */
function normalizeText(s) {
  if (!s) return '';
  return s.toLowerCase()
    .replace(/[\u064B-\u0652]/g, '')
    .replace(/[^\p{L}\p{N}\s\-]/gu, '')
    .replace(/[إأآا]/g, 'ا')
    .replace(/[ى]/g, 'ي')
    .replace(/[ؤ]/g, 'و')
    .replace(/[ئ]/g, 'ي')
    .replace(/\s+/g, ' ')
    .trim();
}

/* --- Resolution helper --- */
function getSelectedResolution() {
  const sel = document.getElementById('resolutionSelector');
  if (!sel) return { width: 1280, height: 720 };
  const val = sel.value || '1280x720';
  const [w, h] = val.split('x').map(n => parseInt(n, 10));
  return { width: isNaN(w) ? 1280 : w, height: isNaN(h) ? 720 : h };
}

/* --- Populate camera dropdown and keep it updated --- */
async function populateCameraList() {
  const sel = document.getElementById('cameraSelector');
  sel.innerHTML = '<option value="">افتراضي (اختيار تلقائي)</option>';
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoInputs = devices.filter(d => d.kind === 'videoinput');
    videoInputs.forEach(dev => {
      const label = dev.label || `كاميرا ${sel.length}`; // label may be empty until permission granted
      const opt = document.createElement('option');
      opt.value = dev.deviceId;
      opt.textContent = `${label} — ${dev.deviceId}`;
      sel.appendChild(opt);
    });
    if (videoInputs.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = 'لا توجد كاميرات مكتشفة';
      sel.appendChild(opt);
    }
  } catch (e) {
    console.error('populateCameraList error', e);
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = 'خطأ عند جلب الأجهزة';
    sel.appendChild(opt);
  }
}

/* --- Diagnostic function: logs devices and attempts a test getUserMedia --- */
async function diagnose() {
  const out = document.getElementById('diagOutput');
  out.textContent = 'جمع معلومات الأجهزة...';
  console.log('Diagnose: enumerateDevices');
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    console.log('Devices:', devices);
    out.textContent = 'الأجهزة المكتشفة:\n' + devices.map(d => `${d.kind} | ${d.label || '(غير مسموح)'} | ${d.deviceId}`).join('\n');
  } catch (e) {
    console.error('enumerateDevices failed', e);
    out.textContent = 'فشل في جلب قائمة الأجهزة. هل سمحت للإذن؟\n' + e;
    return;
  }

  // Try a quick getUserMedia test using selected camera or first available
  const selectedId = document.getElementById('cameraSelector').value;
  const res = getSelectedResolution();
  const constraints = selectedId ? { video: { deviceId: { exact: selectedId }, width: { ideal: res.width }, height: { ideal: res.height } } } :
    { video: { width: { ideal: res.width }, height: { ideal: res.height }, facingMode: "environment" } };

  out.textContent += '\n\nمحاولة فتح الكاميرا لاختبار القيود...';
  console.log('Diagnose: getUserMedia constraints:', constraints);
  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    const track = stream.getVideoTracks()[0];
    const settings = track.getSettings ? track.getSettings() : {};
    console.log('Test stream settings:', settings);
    out.textContent += `\nنجحت: الإعدادات المختارة: ${JSON.stringify(settings)}`;
    stream.getTracks().forEach(t => t.stop());
  } catch (e) {
    console.error('getUserMedia test failed', e);
    out.textContent += `\nفشل فتح الكاميرا بالقيود المختارة: ${e.name || e.message || e}`;
  }

  // refresh camera list (labels may become available after permission)
  await populateCameraList();
}

/* --- startScanner and stopScanner using deviceId or auto selection --- */
async function startScanner() {
  if (_starting) return;
  _starting = true;
  document.getElementById('startBtn').disabled = true;

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('الكاميرا غير مدعومة في هذا المستعرض. افتح الصفحة عبر HTTPS أو استخدم متصفح حديث.');
      return;
    }

    // clean previous instance
    if (_html5QrCodeInstance) {
      try { await _html5QrCodeInstance.stop(); } catch (e) {}
      try { _html5QrCodeInstance.clear(); } catch (e) {}
      _html5QrCodeInstance = null;
    }

    const container = document.getElementById('reader');
    container.innerHTML = '<div id="html5qr-container"></div>';
    const res = getSelectedResolution();
    const qrboxSize = Math.min(300, Math.max(160, Math.floor(Math.min(res.width, res.height) * 0.35)));
    const config = { fps: 10, qrbox: { width: qrboxSize, height: qrboxSize } };

    // chosen camera from dropdown or auto
    const chosenDeviceId = document.getElementById('cameraSelector').value || null;

    // If no chosenDeviceId, attempt to pick a rear camera automatically
    let deviceToUse = chosenDeviceId;
    if (!deviceToUse) {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoInputs = devices.filter(d => d.kind === 'videoinput');
        for (const d of videoInputs) {
          if (/back|rear|environment/i.test(d.label)) { deviceToUse = d.deviceId; break; }
        }
        if (!deviceToUse && videoInputs.length) deviceToUse = videoInputs[0].deviceId;
      } catch (e) {
        console.warn('enumerateDevices failed in startScanner', e);
      }
    }

    _html5QrCodeInstance = new Html5Qrcode("html5qr-container", { verbose: false });

    // Start using deviceId string if available; Html5Qrcode supports deviceId or facingMode string or true
    try {
      if (deviceToUse) {
        await _html5QrCodeInstance.start(
          deviceToUse,
          config,
          decodedText => { try { stopScanner(); } catch(e){}; handleBarcode(decodedText); },
          errorMessage => {}
        );
      } else {
        // fallback: ask library to choose best camera (true)
        await _html5QrCodeInstance.start(
          true,
          config,
          decodedText => { try { stopScanner(); } catch(e){}; handleBarcode(decodedText); },
          errorMessage => {}
        );
      }
      // best-effort apply exact constraints after start
      try { await _html5QrCodeInstance.applyVideoConstraints({ width: res.width, height: res.height }); } catch (e) {}
      document.getElementById('stopScanBtn').style.display = 'inline-block';
    } catch (startErr) {
      console.error('Html5Qrcode.start error', startErr);
      // Show diagnostic hint and refresh device list to help user choose manually
      await populateCameraList();
      alert('فشل تشغيل الماسح باستخدام الإعدادات الحالية. استخدم زر "تشخيص الكاميرات" للاطلاع على الأجهزة ثم جرّب اختيار كاميرا يدويًا.');
      try { _html5QrCodeInstance.clear(); } catch(e){}
      _html5QrCodeInstance = null;
    }

  } catch (err) {
    console.error('startScanner unexpected error', err);
    alert('تعذر تشغيل الكاميرا. افتح Console للاطلاع على التفاصيل.');
  } finally {
    _starting = false;
    document.getElementById('startBtn').disabled = false;
  }
}

async function stopScanner() {
  if (_starting) {
    await new Promise(r => setTimeout(r, 100));
  }
  try {
    if (_html5QrCodeInstance) {
      try { await _html5QrCodeInstance.stop(); } catch (e) { console.warn('stop error', e); }
      try { _html5QrCodeInstance.clear(); } catch (e) {}
      _html5QrCodeInstance = null;
    }
  } catch (e) {
    console.error('stopScanner error', e);
  } finally {
    const btn = document.getElementById('stopScanBtn');
    if (btn) btn.style.display = 'none';
  }
}

/* --- Barcode handling (kept from original) --- */
function handleBarcode(barcode) {
  const sessionIndex = parseInt(document.getElementById('sessionSelector').value, 10);
  const rows = [...document.querySelectorAll('#attendanceTable tbody tr')];
  const row = rows.find(tr => tr.children[2].textContent.trim() === String(barcode));
  if (!row) { alert(`❌ لم يتم العثور على الرقم الجامعي : ${barcode}`); return; }
  const checkboxes = row.querySelectorAll('input[type="checkbox"]');
  const target = checkboxes[sessionIndex];
  if (!target) { alert('خطأ: فهرس الجلسة غير صالح'); return; }
  if (target.checked) { alert(`⚠ الجلسة ${sessionIndex + 1} مسجلة بالفعل لهذا الطالب.`); return; }
  target.checked = true;
  if (typeof window.updateTotal === 'function') window.updateTotal(row, row.dataset.studentId);
  alert(`✅ تم تسجيل حضور: ${row.children[3].textContent.trim()} في جلسة ${sessionIndex + 1}`);
}

function startSpeechRecognition() {
  const statusEl = document.getElementById('voiceStatus');
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('التعرف الصوتي غير مدعوم في هذا المتصفح.');
    document.getElementById('voiceCheckbox').checked = false;
    statusEl.textContent = 'التعرف الصوتي: غير مدعوم';
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'ar-SA';
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;
  recognition.continuous = true;
  recognition.onstart = () => { recognizing = true; document.getElementById('voiceStatus').textContent = 'التعرف الصوتي: مستمع'; };
  recognition.onerror = (event) => { console.warn('recognition error', event.error); if (event.error !== 'no-speech' && event.error !== 'network') stopSpeechRecognition(); };
  recognition.onend = () => { recognizing = false; document.getElementById('voiceStatus').textContent = 'التعرف الصوتي: متوقف'; if (document.getElementById('voiceCheckbox').checked) { try { recognition.start(); } catch (e) {} } };
  recognition.onresult = (event) => { for (let i = event.resultIndex; i < event.results.length; ++i) if (event.results[i].isFinal) handleSpokenName(event.results[i][0].transcript); };
  try { recognition.start(); } catch (e) { recognition = null; document.getElementById('voiceCheckbox').checked = false; document.getElementById('voiceStatus').textContent = 'التعرف الصوتي: فشل البدء'; }
}
function stopSpeechRecognition() { if (recognition) { try { recognition.onresult = null; recognition.onend = null; recognition.onerror = null; recognition.stop(); } catch(e) {} recognition = null; } recognizing = false; document.getElementById('voiceStatus').textContent = 'التعرف الصوتي: متوقف'; }
function handleSpokenName(spoken) {
  const sessionIndex = parseInt(document.getElementById('sessionSelector').value, 10);
  const normSpoken = normalizeText(spoken);
  if (!normSpoken) return;
  const rows = [...document.querySelectorAll('#attendanceTable tbody tr')];
  let best = null;
  for (const row of rows) {
    const name = row.children[3].textContent.trim();
    const normName = normalizeText(name);
    if (normName === normSpoken || normName.includes(normSpoken) || normSpoken.includes(normName)) { best = { row, score: 100 }; break; }
    const tokensSpoken = normSpoken.split(' ');
    const tokensName = normName.split(' ');
    let common = 0;
    for (const t of tokensSpoken) if (tokensName.includes(t)) common++;
    if (common > 0 && (!best || common > best.score)) best = { row, score: common };
  }
  if (!best) { alert(`❌ لم يتم التعرف على اسم مطابق: "${spoken}"`); return; }
  const row = best.row;
  const checkboxes = row.querySelectorAll('input[type="checkbox"]');
  const target = checkboxes[sessionIndex];
  if (!target) { alert('خطأ: فهرس الجلسة غير صالح'); return; }
  if (target.checked) { alert(`⚠ الجلسة ${sessionIndex + 1} مسجلة بالفعل لـ ${row.children[3].textContent.trim()}`); return; }
  target.checked = true;
  if (typeof window.updateTotal === 'function') window.updateTotal(row, row.dataset.studentId);
  alert(`✅ تم تسجيل حضور: ${row.children[3].textContent.trim()} (بواسطة صوتك) في جلسة ${sessionIndex + 1}`);
}

/* --- Initialize camera list when page becomes visible or after permission changes --- */
document.addEventListener('visibilitychange', () => { if (!document.hidden) populateCameraList(); });
navigator.permissions && navigator.permissions.query({ name: 'camera' }).then(p => p.onchange = () => populateCameraList());
</script>
