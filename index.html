const COURSE_KEY_PREFIX = 'attendance_20251_024528_';
let lastTap = 0;

document.addEventListener('DOMContentLoaded', () => {
  const tbody = document.querySelector('#attendanceTable tbody');
  const sectionSelector = document.getElementById('sectionSelector');
  const sortSelector = document.getElementById('sortSelector');

  function loadSavedAttendance(studentId) {
    const raw = localStorage.getItem(COURSE_KEY_PREFIX + studentId);
    return raw ? JSON.parse(raw) : Array(14).fill(false);
  }
  function saveAttendance(studentId, values) {
    localStorage.setItem(COURSE_KEY_PREFIX + studentId, JSON.stringify(values));
  }

  function updateTotal(row, studentId) {
    const checkboxes = row.querySelectorAll('input[type="checkbox"]');
    const values = [];
    let total = 0;
    checkboxes.forEach(cb => { values.push(cb.checked); if (cb.checked) total++; });
    const totalCell = row.querySelector('.total');
    if (totalCell) totalCell.textContent = total;
    saveAttendance(studentId, values);
  }

  function createRow(sect, studentId, name, index, saved) {
    const tr = document.createElement('tr');
    tr.dataset.section = sect;
    tr.dataset.studentId = studentId;
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td>${sect}</td>
      <td>${studentId}</td>
      <td>${name}</td>
      <td class="total">${saved.filter(Boolean).length}</td>
    `;
    for (let i = 0; i < 14; i++) {
      const td = document.createElement('td');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!saved[i];
      cb.addEventListener('change', () => updateTotal(tr, studentId));
      td.appendChild(cb);
      tr.appendChild(td);
    }
    return tr;
  }

  function getFilteredAndSorted() {
    const selectedSection = sectionSelector.value; // '999' means all
    const sortBy = sortSelector.value; // 'section' | 'name' | 'id'
    let list = students.filter(s => selectedSection === '999' || s[0] === selectedSection);
    if (sortBy === 'section') {
      list.sort((a,b) => Number(a[0]) - Number(b[0]) || a[2].localeCompare(b[2], 'ar'));
    } else if (sortBy === 'name') {
      list.sort((a,b) => a[2].localeCompare(b[2], 'ar'));
    } else if (sortBy === 'id') {
      list.sort((a,b) => {
        const ai = Number(a[1]); const bi = Number(b[1]);
        if (!isNaN(ai) && !isNaN(bi)) return ai - bi;
        return a[1].localeCompare(b[1], 'ar');
      });
    }
    return list;
  }

  function populateTable() {
    tbody.innerHTML = '';
    const list = getFilteredAndSorted();
    list.forEach((student, idx) => {
      const [sect, id, name] = student;
      const saved = loadSavedAttendance(id);
      const tr = createRow(sect, id, name, idx, saved);
      tbody.appendChild(tr);
    });
  }

  sectionSelector.addEventListener('change', populateTable);
  sortSelector.addEventListener('change', populateTable);

  populateTable();
  window.updateTotal = updateTotal;
});

/* --- CSV download / upload --- */
function downloadCSV() {
  const rows = document.querySelectorAll('#attendanceTable tbody tr');
  let header = "رقم,الشعبة,الرقم الجامعي,اسم الطالب,الإجمالي";
  for (let i = 1; i <= 14; i++) header += `,جلسة ${i}`;
  header += "\n";

  let csv = header;
  rows.forEach((row, idx) => {
    const cells = row.querySelectorAll('td');
    const number = idx + 1;
    const sect = cells[1].textContent.trim();
    const id = cells[2].textContent.trim();
    const name = cells[3].textContent.trim();
    const total = cells[4].textContent.trim();
    let sessionData = '';
    for (let i = 5; i < cells.length; i++) {
      const input = cells[i].querySelector('input');
      sessionData += `,${input && input.checked ? '1' : '0'}`;
    }
    csv += `${number},${sect},${id},"${name}",${total}${sessionData}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "20251_كيمياء حيوية سريرية (1).csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleCSVUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) return;
    lines.shift();
    lines.forEach(line => {
      const parts = [];
      let cur = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuotes = !inQuotes; continue; }
        if (ch === ',' && !inQuotes) { parts.push(cur); cur = ''; continue; }
        cur += ch;
      }
      if (cur !== '') parts.push(cur);
      if (parts.length < 5) return;
      const id = parts[2].trim();
      const sessions = parts.slice(5, 19).map(v => String(v).trim() === '1');
      while (sessions.length < 14) sessions.push(false);
      localStorage.setItem(COURSE_KEY_PREFIX + id, JSON.stringify(sessions));
    });
    event.target.value = '';
    location.reload();
  };
  reader.readAsText(file);
}

/* --- Speech selection --- */
function speakSelectedText() {
  const selectedText = window.getSelection().toString().trim();
  if (!selectedText) return;
  try { speechSynthesis.cancel(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(selectedText);
  u.lang = 'ar-SY';
  speechSynthesis.speak(u);
}
document.addEventListener('mouseup', speakSelectedText);
document.addEventListener('touchend', speakSelectedText);
document.addEventListener('touchstart', function () {
  const now = Date.now(); const dt = now - lastTap;
  if (dt < 300 && dt > 0) speakSelectedText();
  lastTap = now;
});

/* --- Clearing data --- */
function clearAttendanceData() {
  const choice = document.getElementById('clearChoice').value;
  const semesterToken = '_20251_';
  const keysToRemove = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key) continue;
    if (choice === '1' && key.startsWith(COURSE_KEY_PREFIX)) keysToRemove.push(key);
    else if (choice === '2' && key.includes(semesterToken)) keysToRemove.push(key);
    else if (choice === '3' && key.startsWith('attendance_')) keysToRemove.push(key);
  }
  if (keysToRemove.length === 0) { alert('لا توجد مفاتيح للحذف بناءً على الاختيار.'); return; }
  if (!confirm(`سيتم حذف ${keysToRemove.length} عنصر. هل تود المتابعة؟`)) return;
  keysToRemove.forEach(k => localStorage.removeItem(k));
  const messages = { "1":"☑ تم محي سجلات هذا المقرر في هذا الفصل.","2":"☑ تم محي سجلات مقررات هذا الفصل.","3":"☑ تم محي سجلات جميع الفصول." };
  alert(messages[choice] || 'تمت العملية.');
  location.reload();
}

/* --- Safer scanner for iPhone / fallback handling --- */
function startScanner() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('الكاميرا غير مدعومة في هذا المستعرض. افتح الصفحة عبر HTTPS أو استخدم متصفح حديث.');
    return;
  }

  const html5QrCode = new Html5Qrcode("reader", { verbose: false });
  const config = { fps: 10, qrbox: { width: 250, height: 250 } };

  // try with exact facingMode first, then fall back if rejected
  html5QrCode.start(
    { facingMode: { exact: "environment" } },
    config,
    decodedText => { html5QrCode.stop().then(() => handleBarcode(decodedText)).catch(()=>{}); },
    errorMessage => {}
  ).catch(() => {
    // fallback without exact constraint (helps some iOS devices/browsers)
    html5QrCode.start(
      { facingMode: "environment" },
      config,
      decodedText => { html5QrCode.stop().then(() => handleBarcode(decodedText)).catch(()=>{}); },
      errorMessage => {}
    ).catch(err => {
      alert('تعذر الوصول إلى الكاميرا. افتح الصفحة عبر HTTPS وامنح الإذن للكاميرا.');
      console.error(err);
    });
  });
}

function handleBarcode(barcode) {
  const sessionIndex = parseInt(document.getElementById('sessionSelector').value, 10);
  const rows = [...document.querySelectorAll('#attendanceTable tbody tr')];
  const row = rows.find(tr => tr.children[2].textContent.trim() === String(barcode));
  if (!row) { alert(`❌ لم يتم العثور على الرقم الجامعي : ${barcode}`); return; }
  const checkboxes = row.querySelectorAll('input[type="checkbox"]');
  const target = checkboxes[sessionIndex];
  if (!target) { alert('خطأ: فهرس الجلسة غير صالح'); return; }
  if (target.checked) { alert(`⚠ الجلسة ${sessionIndex + 1} مسجلة بالفعل لهذا الطالب.`); return; }
  target.checked = true;
  if (typeof window.updateTotal === 'function') window.updateTotal(row, row.dataset.studentId);
  alert(`✅ تم تسجيل حضور: ${row.children[3].textContent.trim()} في جلسة ${sessionIndex + 1}`);
}
